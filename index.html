<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Certificate Maker</title><link rel="stylesheet" href="styles.css"></head><body><main><header><div><p class="eyebrow">Internal Etsy order tool</p><h1>Printable Children's Certificate Maker</h1><p>Enter personalization details, preview a polished A4 certificate, then download delivery files.</p></div><div><button id="pdf">Download PDF</button><button id="png">Download PNG</button></div></header><div class="workspace"><form id="form"><label>Child's name<input id="name" value="Avery" maxlength="70" required></label><label>Child's age <span>optional</span><input id="age" value="7" maxlength="12"></label><label>Achievement or reason<textarea id="achievement" rows="4" required>being a brave explorer and trying something new</textarea></label><label>Short personal message <span>optional</span><textarea id="message" rows="3">Your curiosity, courage, and bright smile make every adventure special.</textarea></label><label>Date <span>optional</span><input id="date"></label><fieldset><legend>Certificate style</legend><label class="radio"><input name="style" type="radio" value="explorer" checked>Brave Explorer</label><label class="radio"><input name="style" type="radio" value="magical">Magical Hero</label><label class="radio"><input name="style" type="radio" value="celebration">Colorful Celebration</label></fieldset></form><section class="preview"><div class="previewbar"><b>Live A4 preview</b><span id="status">Ready</span></div><div id="certificate" class="certificate explorer"></div></section></div></main><script src="app.js"></script></body></html>
