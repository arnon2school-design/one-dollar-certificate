<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="793" viewBox="0 0 1122 793"><foreignObject width="1122" height="793"><div xmlns="http://www.w3.org/1999/xhtml"><style>*{box-sizing:border-box}body{margin:0;background:#f4efe7;color:#26313a;font-family:Georgia,serif}main{max-width:1420px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:22px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:#8a5b2d;font:900 .78rem Arial}header h1{font-size:clamp(2rem,4vw,4rem);margin:.1rem 0}header p{font-family:Arial,sans-serif;max-width:720px}button{border:0;border-radius:999px;background:#233142;color:white;padding:14px 22px;font:900 1rem Arial;box-shadow:0 8px 18px #0002;cursor:pointer;margin:4px}button+button{background:#b95b38}.workspace{display:grid;grid-template-columns:360px 1fr;gap:24px}form{font-family:Arial,sans-serif;background:#fffaf2;border:1px solid #e7d9c6;border-radius:24px;padding:22px;box-shadow:0 14px 35px #7a5b341c;height:max-content}label,legend{font-weight:900}label{display:block;margin-bottom:15px}label span{font-weight:400;color:#6f7880}input,textarea{width:100%;margin-top:7px;border:1px solid #d7c8b3;border-radius:14px;padding:12px;font:inherit;background:white}fieldset{border:1px dashed #cdb89c;border-radius:18px;padding:14px}.radio{display:flex;align-items:center;gap:8px;margin:10px 0}.radio input{width:auto;margin:0}.preview{min-width:0}.previewbar{font-family:Arial,sans-serif;display:flex;justify-content:space-between;margin-bottom:12px;color:#5c6670}.certificate{width:min(100%,1122px);aspect-ratio:297/210;margin:auto;background:white;box-shadow:0 20px 55px #4b382533;overflow:hidden}.cert{width:100%;height:100%;position:relative;padding:3.8%;background:#fff}.inner{height:100%;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:space-between;padding:3.3% 6%;z-index:1}.inner:before{content:"";position:absolute;inset:0;border:4px double currentColor;border-radius:22px;opacity:.65}.top{display:flex;gap:28px;letter-spacing:.25em;font:900 clamp(.55rem,1.2vw,1rem) Arial}.cert h2{font-size:clamp(1.7rem,4.1vw,4rem);margin:.5% 0 0}.presented,.for{margin:0;color:#59626b;font:700 clamp(.7rem,1.4vw,1rem) Arial}.cert h1{font-size:clamp(2.6rem,7vw,6.8rem);line-height:.95;margin:0;max-width:92%;overflow-wrap:anywhere}.cert h1.md{font-size:clamp(2.2rem,5.7vw,5.3rem)}.cert h1.sm{font-size:clamp(1.9rem,4.6vw,4.2rem)}.cert h1.xs{font-size:clamp(1.5rem,3.5vw,3.2rem)}.age{margin:0;border-radius:999px;padding:.25rem 1rem;font:900 1rem Arial}.achievement{font-size:clamp(1.25rem,2.7vw,2.6rem);line-height:1.15;max-width:86%;margin:0;overflow-wrap:anywhere}.message{font:400 clamp(.85rem,1.55vw,1.25rem) Arial;line-height:1.28;max-width:78%;margin:0;color:#3e4a54}.footer{display:flex;align-items:end;justify-content:space-between;width:80%;gap:20px}.footer b{display:block;border-bottom:2px solid currentColor;padding:0 28px 6px}.footer span{font:400 .8rem Arial;color:#68727a}.seal{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:2.1rem}.corner{position:absolute;width:22%;height:22%;opacity:.9}.c1{left:0;top:0}.c2{right:0;top:0;transform:scaleX(-1)}.c3{left:0;bottom:0;transform:scaleY(-1)}.c4{right:0;bottom:0;transform:scale(-1)}.explorer .cert{color:#17483f;background:radial-gradient(circle at 50% 42%,#fffdf5 0 48%,#e4f2de 49% 100%)}.explorer .corner{background:radial-gradient(circle at 20% 20%,#2f7b58 0 10%,transparent 11%),radial-gradient(circle at 45% 18%,#d99432 0 8%,transparent 9%),linear-gradient(135deg,#17483f 0 7%,transparent 8%)}.explorer h2{color:#1f6b52}.explorer .age,.explorer .seal{background:#d99432;color:#fff8e8}.magical .cert{color:#55306d;background:radial-gradient(circle at 50% 45%,#fffaff 0 46%,#eee3ff 47% 100%)}.magical .corner{background:radial-gradient(circle,#f6c85f 0 7%,transparent 8%),radial-gradient(circle at 40% 25%,#bd7bff 0 9%,transparent 10%),linear-gradient(135deg,#7a4fb0 0 7%,transparent 8%)}.magical h2{color:#7745aa}.magical .age,.magical .seal{background:#f6c85f;color:#55306d}.celebration .cert{color:#21456b;background:radial-gradient(circle at 50% 45%,#fff 0 46%,#e6f6ff 47% 100%)}.celebration .corner{background:radial-gradient(circle at 20% 20%,#ff6f61 0 8%,transparent 9%),radial-gradient(circle at 50% 25%,#39b7a5 0 8%,transparent 9%),radial-gradient(circle at 30% 55%,#ffd166 0 7%,transparent 8%),linear-gradient(135deg,#4d77ff 0 7%,transparent 8%)}.celebration h2{color:#df5b49}.celebration .age,.celebration .seal{background:#39b7a5;color:white}@media(max-width:850px){main{padding:14px}header{display:block}.workspace{grid-template-columns:1fr}.footer{width:92%}.footer b{padding:0 6px 4px}.seal{width:52px;height:52px}.inner{padding:3%}}@media print{body{background:white}main{padding:0}header,form,.previewbar{display:none}.workspace{display:block}.certificate{width:297mm;height:210mm;box-shadow:none}.cert{break-inside:avoid}}
</style><div xmlns="http://www.w3.org/1999/xhtml" class="certificate explorer"><section class="cert"><div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div><div class="inner"><div class="top"><span>SAMPLE</span><span>✦</span><span>PREVIEW</span></div><h2>Brave Explorer</h2><p class="presented">This certificate is proudly presented to</p><h1>Avery</h1><p class="age">Age 7</p><p class="for">for</p><p class="achievement">being a brave explorer and trying something new</p><p class="message">“Your bright spirit makes every day special.”</p><div class="footer"><div><b>July 12, 2026</b><span>Date</span></div><div class="seal">✦</div><div><b>With pride</b><span>Presented by</span></div></div></div></section></div></div></foreignObject></svg>